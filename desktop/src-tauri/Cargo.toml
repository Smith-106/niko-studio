[package]
name = "niko-studio-desktop"
version = "11.0.2"
description = "Niko-Studio Desktop - AI Writing Assistant"
authors = ["Niko-Studio Team"]
edition = "2021"
# Disambiguate the two [[bin]] targets (main app + niko-gateway-launcher) for
# `cargo run` / Tauri's release build, which both expect a single default.
default-run = "niko-studio-desktop"

[lib]
name = "niko_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# ISS-20260430-001 �?replacement for the stale 128 MB Python compat sidecar.
# This binary is the only file Tauri externalBin resolves at packaging time;
# it spawns the staged Node TS gateway from <install>/sidecar/.
[[bin]]
name = "niko-gateway-launcher"
path = "src/bin/niko-gateway-launcher.rs"
# Keep the launcher binary minimal �?no Tauri / reqwest deps; just std spawn.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
sentry = "0.36"
once_cell = "1"
notify = "6"
dirs = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
