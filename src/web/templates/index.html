<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Writing Agent Platform</title>

    <!-- Fonts & Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape-dagre/2.5.0/cytoscape-dagre.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <i class="fas fa-pen-nib"></i> AI Writing Agent
            </div>

            <div class="config-section">
                <h3><i class="fas fa-layer-group"></i> 工作流配置</h3>
                <div class="form-group">
                    <label>工作流级别</label>
                    <select id="work-mode">
                        <option value="L1">L1: 快速修改 (Rapid)</option>
                        <option value="L2">L2: 场景规划 (Lite)</option>
                        <option value="L3" selected>L3: 章节开发 (Standard)</option>
                        <option value="L4">L4: 故事探索 (Brainstorm)</option>
                        <option value="L5">L5: 全流程编排 (Coordinator)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>底层模型</label>
                    <select id="model-name">
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        <option value="gpt-4o">GPT-4o</option>
                        <option value="claude-3-5-sonnet">Claude 3.5 Sonnet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>LOCK 阈值</label>
                    <input type="range" min="0" max="40" value="28" id="lock-threshold">
                    <span class="range-val" id="lock-val">28</span>
                </div>
            </div>

            <div class="status-panel">
                <h3><i class="fas fa-server"></i> 系统状态</h3>
                <div id="connection-status" class="status-indicator disconnected">
                    <span class="dot"></span> <span class="text">未连接</span>
                </div>
                <div id="agent-status" class="agent-status">
                    <div><i class="fas fa-robot"></i> 待机中</div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <h2>💬 协作对话流</h2>
                <div class="actions">
                    <button class="btn-icon" title="导出"><i class="fas fa-download"></i></button>
                    <button class="btn-icon" title="清空"><i class="fas fa-trash"></i></button>
                </div>
            </header>

            <div id="chat-stream" class="chat-stream">
                <!-- Messages will be injected here -->
                <div class="message system">
                    <div class="avatar"><i class="fas fa-info-circle"></i></div>
                    <div class="content">欢迎使用 AI Writing Agent 平台。请在下方输入创作需求。</div>
                </div>
            </div>

            <div class="input-area">
                <textarea id="user-input" placeholder="输入指令 (支持 @ 语法路由到特定 Agent)..." rows="3"></textarea>
                <button id="send-btn" class="send-btn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </main>

        <!-- Right Panel (Tabs) -->
        <section class="right-panel">
            <div class="tabs">
                <button class="tab-btn active" data-tab="preview">📝 草稿预览</button>
                <button class="tab-btn" data-tab="lock">📊 LOCK</button>
                <button class="tab-btn" data-tab="radar">🎯 8维度</button>
                <button class="tab-btn" data-tab="kanban">📇 场景</button>
                <button class="tab-btn" data-tab="graph">🕸️ 依赖图</button>
            </div>

            <div class="tab-content">
                <!-- Draft Preview -->
                <div id="preview" class="tab-pane active">
                    <div class="toolbar">
                        <span class="version-tag">v1.0</span>
                        <div class="actions">
                            <button class="btn-sm"><i class="fas fa-file-word"></i> DOCX</button>
                            <button class="btn-sm"><i class="fas fa-check"></i> 批准</button>
                        </div>
                    </div>
                    <div id="draft-container" class="markdown-body">
                        <div class="placeholder-text">尚无草稿内容...</div>
                    </div>
                </div>

                <!-- LOCK Dashboard -->
                <div id="lock" class="tab-pane">
                    <div class="lock-summary">
                        <div class="total-score">
                            <span id="lock-total">--</span>
                            <span class="label">/40</span>
                        </div>
                        <div class="score-status" id="lock-status">待评估</div>
                    </div>
                    <div id="lock-chart"></div>
                    <div id="lock-details" class="details-list"></div>
                </div>

                <!-- Quality Radar -->
                <div id="radar" class="tab-pane">
                    <div id="quality-radar"></div>
                    <div id="quality-details" class="details-list"></div>
                </div>

                <!-- Kanban -->
                <div id="kanban" class="tab-pane">
                    <div class="kanban-board">
                        <div class="column" id="col-pending">
                            <h4>⏳ PENDING</h4>
                            <div class="card-list"></div>
                        </div>
                        <div class="column" id="col-writing">
                            <h4>✍️ WRITING</h4>
                            <div class="card-list"></div>
                        </div>
                        <div class="column" id="col-done">
                            <h4>✅ DONE</h4>
                            <div class="card-list"></div>
                        </div>
                    </div>
                </div>

                <!-- Dependency Graph -->
                <div id="graph" class="tab-pane">
                    <div id="cy-container"></div>
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
</body>
</html>
