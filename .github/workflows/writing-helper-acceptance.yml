name: Writing Helper Acceptance

concurrency:
  group: writing-helper-acceptance-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      strict:
        required: false
        default: true
        type: boolean
      log_level:
        required: false
        default: warning
        type: string
      port:
        required: false
        default: "18080"
        type: string
      host:
        required: false
        default: 127.0.0.1
        type: string
  workflow_dispatch:
    inputs:
      strict:
        description: Run strict assertions
        required: false
        default: true
        type: boolean
      log_level:
        description: Gateway log level
        required: false
        default: warning
        type: choice
        options:
          - warning
          - info
          - debug
      port:
        description: Gateway port
        required: false
        default: "18080"
        type: string
      host:
        description: Gateway host
        required: false
        default: 127.0.0.1
        type: string

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-ts/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install backend dependencies
        run: npm ci
        working-directory: src-ts

      - name: Start gateway in background
        shell: pwsh
        env:
          NIKO_GATEWAY_RUNTIME: node
        run: |
          $proc = Start-Process -FilePath python -ArgumentList "scripts/start_gateway.py --host ${{ inputs.host }} --port ${{ inputs.port }} --log-level ${{ inputs.log_level }}" -PassThru -RedirectStandardOutput gateway.log -RedirectStandardError gateway.err
          "GATEWAY_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Wait for gateway health
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $resp = Invoke-RestMethod -Method Get -Uri "http://${{ inputs.host }}:${{ inputs.port }}/health"
              if ($null -ne $resp) {
                $ok = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $ok) {
            throw "Gateway did not become healthy within timeout"
          }

      - name: Run writing-helper acceptance
        shell: powershell
        run: |
          if ('${{ inputs.strict }}' -eq 'true') {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-writing-helper.ps1 -Strict -Port ${{ inputs.port }} -Host ${{ inputs.host }}
          } else {
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\check-writing-helper.ps1 -Port ${{ inputs.port }} -Host ${{ inputs.host }}
          }

      - name: Upload failed cases artifact
        if: failure() && hashFiles('failed-writing-helper-cases.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: failed-writing-helper-cases
          path: failed-writing-helper-cases.json

      - name: Upload writing-helper acceptance evidence
        if: always() && hashFiles('.workflow/evidence/release/writing-helper-acceptance.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: writing-helper-acceptance-evidence
          path: .workflow/evidence/release/writing-helper-acceptance.json

      - name: Upload gateway logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: writing-helper-gateway-logs
          path: |
            gateway.log
            gateway.err

      - name: Stop gateway
        if: always()
        shell: pwsh
        run: |
          if ($env:GATEWAY_PID) {
            Stop-Process -Id $env:GATEWAY_PID -Force -ErrorAction SilentlyContinue
          }
