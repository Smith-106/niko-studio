name: Writing Helper Acceptance

concurrency:
  group: writing-helper-acceptance-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      strict:
        description: Run strict assertions
        required: false
        default: true
        type: boolean
      log_level:
        description: Gateway log level
        required: false
        default: warning
        type: choice
        options:
          - warning
          - info
          - debug

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start gateway in background
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath python -ArgumentList "scripts/start_gateway.py --host 127.0.0.1 --port 8000 --log-level ${{ inputs.log_level }}" -PassThru -RedirectStandardOutput gateway.log -RedirectStandardError gateway.err
          "GATEWAY_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Wait for gateway health
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $resp = Invoke-RestMethod -Method Get -Uri "http://127.0.0.1:8000/health"
              if ($null -ne $resp) {
                $ok = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $ok) {
            throw "Gateway did not become healthy within timeout"
          }

      - name: Run writing-helper acceptance
        shell: pwsh
        run: |
          if ('${{ inputs.strict }}' -eq 'true') {
            ./scripts/check-writing-helper.ps1 -Strict
          } else {
            ./scripts/check-writing-helper.ps1
          }

      - name: Upload failed cases artifact
        if: failure() && hashFiles('failed-writing-helper-cases.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: failed-writing-helper-cases
          path: failed-writing-helper-cases.json

      - name: Upload gateway logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: writing-helper-gateway-logs
          path: |
            gateway.log
            gateway.err

      - name: Stop gateway
        if: always()
        shell: pwsh
        run: |
          if ($env:GATEWAY_PID) {
            Stop-Process -Id $env:GATEWAY_PID -Force -ErrorAction SilentlyContinue
          }
