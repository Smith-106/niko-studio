name: Writing Helper Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'src/services/writing_helper.py'
      - 'src/mcp/gateway.py'
      - 'scripts/check-writing-helper.ps1'
      - '.github/workflows/writing-helper-acceptance.yml'
      - 'tests/unit/services/test_writing_helper.py'
      - 'tests/unit/mcp/test_gateway_endpoints.py'
      - 'desktop/src/api/client.ts'
      - 'desktop/src/api/client.test.ts'
      - 'desktop/src/components/WritingHelperPanel.tsx'
      - 'desktop/src/components/WritingHelperPanel.test.tsx'
      - 'desktop/src/App.tsx'
  pull_request:
    branches: [main]
    paths:
      - 'src/services/writing_helper.py'
      - 'src/mcp/gateway.py'
      - 'scripts/check-writing-helper.ps1'
      - '.github/workflows/writing-helper-acceptance.yml'
      - 'tests/unit/services/test_writing_helper.py'
      - 'tests/unit/mcp/test_gateway_endpoints.py'
      - 'desktop/src/api/client.ts'
      - 'desktop/src/api/client.test.ts'
      - 'desktop/src/components/WritingHelperPanel.tsx'
      - 'desktop/src/components/WritingHelperPanel.test.tsx'
      - 'desktop/src/App.tsx'

jobs:
  acceptance:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start gateway in background
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath python -ArgumentList "scripts/start_gateway.py --host 127.0.0.1 --port 8000 --log-level warning" -PassThru -RedirectStandardOutput gateway.log -RedirectStandardError gateway.err
          "GATEWAY_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Wait for gateway health
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $resp = Invoke-RestMethod -Method Get -Uri "http://127.0.0.1:8000/health"
              if ($null -ne $resp) {
                $ok = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-not $ok) {
            throw "Gateway did not become healthy within timeout"
          }

      - name: Run writing-helper strict acceptance
        shell: pwsh
        run: |
          ./scripts/check-writing-helper.ps1 -Strict

      - name: Upload failed cases artifact
        if: failure() && hashFiles('failed-writing-helper-cases.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: failed-writing-helper-cases
          path: failed-writing-helper-cases.json

      - name: Upload gateway logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: writing-helper-gateway-logs
          path: |
            gateway.log
            gateway.err

      - name: Stop gateway
        if: always()
        shell: pwsh
        run: |
          if ($env:GATEWAY_PID) {
            Stop-Process -Id $env:GATEWAY_PID -Force -ErrorAction SilentlyContinue
          }
