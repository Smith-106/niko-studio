name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, async-init-fix]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: niko-studio

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run gateway and coordinator unit tests
        run: |
          pytest tests/unit/test_level5_coordinator.py \
                 tests/unit/mcp/test_gateway_chat.py \
                 tests/unit/mcp/test_gateway_stream.py -q
