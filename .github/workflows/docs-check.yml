name: Docs Check

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-check.yml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-check.yml'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npx playwright install --with-deps chromium
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
        env:
          VITE_BASE_URL: /niko-studio/
      - run: npm run test:searchbox
        working-directory: docs-site
        env:
          NIKO_DOCS_BASE_PATH: /niko-studio/
