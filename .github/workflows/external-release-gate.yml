name: External Release Gate

on:
  workflow_call:
    inputs:
      run_codecov:
        required: false
        type: boolean
        default: true
      codecov_fail_ci_if_error:
        required: false
        type: boolean
        default: true
      gate_label:
        required: false
        type: string
        default: external
      run_metrics_guard:
        required: false
        type: boolean
        default: true
      run_e2e:
        required: false
        type: boolean
        default: true
      signed_release:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run_codecov:
        description: Upload coverage to Codecov when a token is available.
        required: false
        type: boolean
        default: true
      codecov_fail_ci_if_error:
        description: Treat Codecov upload failures as blocking when a token is configured.
        required: false
        type: boolean
        default: true
      gate_label:
        description: Gate label recorded in artifact names and summaries.
        required: false
        type: string
        default: external
      run_metrics_guard:
        description: Run production guard checks when gate_label is not external.
        required: false
        type: boolean
        default: true
      run_e2e:
        description: Run workflow smoke tests when gate_label is not external.
        required: false
        type: boolean
        default: true
      signed_release:
        description: Attempt signed external release path when signing inputs are present.
        required: false
        type: boolean
        default: false

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run version consistency check
        run: |
          python scripts/check_versions.py

      - name: Run delivery semantic gate
        run: |
          python scripts/delivery_gate.py

      - name: Run Python static checks (${{ inputs.gate_label }})
        run: |
          python -m ruff check --select F,I scripts tests/unit/scripts
          python -m ruff format --check scripts tests/unit/scripts

      - name: Run governance script regression tests (${{ inputs.gate_label }})
        run: |
          python scripts/run_targeted_pytest.py tests/unit/scripts/test_governance_scripts.py -q --junitxml=governance-scripts.junit.xml

      - name: Upload governance script regression report
        uses: actions/upload-artifact@v6
        with:
          name: governance-scripts-report-${{ inputs.gate_label }}
          path: governance-scripts.junit.xml

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src-ts/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: src-ts

      - name: Audit backend dependencies (high+, advisory) (${{ inputs.gate_label }})
        continue-on-error: true
        run: npm run audit:high
        working-directory: src-ts

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Resolve effective gate semantics
        id: gate_mode
        run: |
          if [ "${{ inputs.gate_label }}" = "external" ]; then
            echo "run_metrics_guard=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_metrics_guard=${{ inputs.run_metrics_guard }}" >> "$GITHUB_OUTPUT"
            echo "run_e2e=${{ inputs.run_e2e }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run backend Phase 4 coverage baseline (${{ inputs.gate_label }})
        run: |
          npm run test:coverage:phase4 -- --coverage.reporter=text --coverage.reporter=json --coverage.reporter=html --coverage.reporter=cobertura
        working-directory: src-ts

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: src-ts/coverage/cobertura-coverage.xml

      - name: Run production runtime guards (${{ inputs.gate_label }})
        if: ${{ steps.gate_mode.outputs.run_metrics_guard == 'true' }}
        env:
          NIKO_ENV: production
          NIKO_CORS_PROD_ORIGINS: https://app.example.com,https://gray.example.com
          NIKO_GATEWAY_METRICS_ENABLED: "true"
        run: |
          npm exec -- vitest run tests/gateway-server.runtime.test.ts tests/mcp/health-endpoints.test.ts --reporter=default --reporter=junit --outputFile.junit=../vitest-production-guard.xml
        working-directory: src-ts

      - name: Upload production guard report artifact
        if: ${{ steps.gate_mode.outputs.run_metrics_guard == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: vitest-production-guard-${{ inputs.gate_label }}
          path: vitest-production-guard.xml

      - name: Run external smoke (${{ inputs.gate_label }})
        if: ${{ steps.gate_mode.outputs.run_e2e == 'true' }}
        run: |
          npm exec -- vitest run tests/mcp/workflow-endpoints.integration.test.ts tests/mcp/workflow-critic-smoke.integration.test.ts --reporter=default --reporter=junit --outputFile.junit=../vitest-e2e.xml
        working-directory: src-ts

      - name: Upload e2e report artifact
        if: ${{ steps.gate_mode.outputs.run_e2e == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: vitest-e2e-report-${{ inputs.gate_label }}
          path: vitest-e2e.xml

      - name: Check desktop sidecar readiness
        id: sidecar-readiness
        run: |
          npm run build:sidecar
          npm run validate:sidecar-contract
          echo "desktop sidecar readiness ok"
        working-directory: desktop

      - name: Run authority alignment check (${{ inputs.gate_label }})
        run: |
          python scripts/check_authority_alignment.py > authority-alignment.json

      - name: Upload authority alignment artifact
        uses: actions/upload-artifact@v6
        with:
          name: authority-alignment-report-${{ inputs.gate_label }}
          path: authority-alignment.json

      - name: Resolve Codecov strict mode
        id: codecov_mode
        if: ${{ inputs.run_codecov }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ] && [ "${{ inputs.codecov_fail_ci_if_error }}" = "true" ]; then
            echo "fail_ci_if_error=true" >> "$GITHUB_OUTPUT"
          else
            echo "fail_ci_if_error=false" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.codecov_fail_ci_if_error }}" = "true" ]; then
              echo "::warning::CODECOV_TOKEN is missing, downgrade strict Codecov gate for this run"
            fi
          fi

      - name: Upload coverage to Codecov
        if: ${{ inputs.run_codecov }}
        uses: codecov/codecov-action@v4
        with:
          files: ./src-ts/coverage/cobertura-coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ steps.codecov_mode.outputs.fail_ci_if_error }}

  desktop-packaging:
    runs-on: windows-latest
    needs: [gate]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Resolve strict packaging prerequisite
        id: packaging-prereq
        shell: pwsh
        run: |
          $legacyEntry = Test-Path 'src/mcp/sidecar_entry.py'
          $packagedCompatArtifact = Test-Path 'desktop/src-tauri/bin/niko-gateway-x86_64-pc-windows-msvc.exe'

          if ($legacyEntry -or $packagedCompatArtifact) {
            "strict_required=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'desktop-packaging: strict Windows packaging gate enabled (Python compatibility sidecar prerequisite present). release_state=unsigned_local_proof by default because tauri.conf keeps certificateThumbprint=null and timestampUrl=""; signed_external_release still requires release-private signing inputs on the Windows packaging host.'
            return
          }

          "strict_required=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $warning = 'Skipping strict Windows packaging gate because this checkout does not include the Python compatibility sidecar prerequisite. Sidecar readiness and advisory packaging logs remain authoritative until the compatibility artifact is hydrated.'
          Write-Host "::warning::$warning"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'desktop-packaging: prerequisite_missing_hold because the Python compatibility sidecar prerequisite is not hydrated in this checkout; rely on sidecar readiness plus advisory packaging logs until the compatibility artifact is hydrated.'

      - name: Install Rust toolchain
        if: ${{ steps.packaging-prereq.outputs.strict_required == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        if: ${{ steps.packaging-prereq.outputs.strict_required == 'true' }}
        run: npm ci
        working-directory: desktop

      - name: Run desktop packaging dry-run (${{ inputs.gate_label }})
        if: ${{ steps.packaging-prereq.outputs.strict_required == 'true' }}
        run: npm run validate:package:dry-run
        working-directory: desktop

      - name: Attempt signed external release path
        if: ${{ inputs.signed_release }}
        shell: pwsh
        working-directory: desktop
        env:
          NIKO_WINDOWS_CERT_THUMBPRINT: ${{ secrets.NIKO_WINDOWS_CERT_THUMBPRINT }}
          NIKO_WINDOWS_TIMESTAMP_URL: ${{ secrets.NIKO_WINDOWS_TIMESTAMP_URL }}
        run: |
          if (-not $env:NIKO_WINDOWS_CERT_THUMBPRINT -or -not $env:NIKO_WINDOWS_TIMESTAMP_URL) {
            throw 'signed_release=true requires NIKO_WINDOWS_CERT_THUMBPRINT and NIKO_WINDOWS_TIMESTAMP_URL secrets'
          }
          npm run tauri:build:signed

      - name: Upload desktop packaging dry-run artifact
        if: ${{ steps.packaging-prereq.outputs.strict_required == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: desktop-packaging-dry-run-${{ inputs.gate_label }}
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/niko-studio-desktop.exe

  writing-helper-acceptance:
    if: ${{ inputs.gate_label == 'external' || inputs.run_e2e }}
    needs: [gate]
    uses: ./.github/workflows/writing-helper-acceptance.yml
    with:
      strict: true
      log_level: warning
      port: '18080'
      host: '127.0.0.1'
