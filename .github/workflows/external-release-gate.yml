name: External Release Gate

on:
  workflow_call:
    inputs:
      run_codecov:
        required: false
        type: boolean
        default: true
      codecov_fail_ci_if_error:
        required: false
        type: boolean
        default: true
      gate_label:
        required: false
        type: string
        default: external
      run_metrics_guard:
        required: false
        type: boolean
        default: true
      run_e2e:
        required: false
        type: boolean
        default: true

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run production runtime guards (${{ inputs.gate_label }})
        if: ${{ inputs.run_metrics_guard }}
        env:
          NIKO_ENV: production
          NIKO_CORS_PROD_ORIGINS: https://app.example.com,https://gray.example.com
          NIKO_GATEWAY_METRICS_ENABLED: "true"
        run: |
          python -c "from src.mcp.gateway import _resolve_reload_enabled, _resolve_cors_origins; from src.config import init_config, get_config_value; init_config(config_path='config/niko-studio.production.yaml', hot_reload=False); assert _resolve_reload_enabled() is False; origins = _resolve_cors_origins(); assert origins and all(o not in {'*','http://localhost:3000','http://127.0.0.1:3000'} for o in origins); assert bool(get_config_value('gateway.metrics_enabled', True)) is True; print('external production guards ok')"

      - name: Run e2e smoke (${{ inputs.gate_label }})
        if: ${{ inputs.run_e2e }}
        run: |
          pytest -o addopts="" -m "e2e" tests/integration/test_e2e_workflow.py -q --tb=short --junitxml=pytest-e2e.xml

      - name: Upload e2e report artifact
        if: ${{ inputs.run_e2e }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-e2e-report-${{ inputs.gate_label }}
          path: pytest-e2e.xml

      - name: Download coverage artifact
        if: ${{ inputs.run_codecov }}
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Upload coverage to Codecov
        if: ${{ inputs.run_codecov }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ inputs.codecov_fail_ci_if_error && secrets.CODECOV_TOKEN != '' }}
