name: External Release Gate

on:
  workflow_call:
    inputs:
      run_codecov:
        required: false
        type: boolean
        default: true
      codecov_fail_ci_if_error:
        required: false
        type: boolean
        default: true
      gate_label:
        required: false
        type: string
        default: external

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run e2e smoke (${{ inputs.gate_label }})
        run: |
          pytest -o addopts="" -m "e2e" tests/integration/test_e2e_workflow.py -q --tb=short --junitxml=pytest-e2e.xml

      - name: Upload e2e report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-e2e-report-${{ inputs.gate_label }}
          path: pytest-e2e.xml

      - name: Download coverage artifact
        if: ${{ inputs.run_codecov }}
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Upload coverage to Codecov
        if: ${{ inputs.run_codecov }}
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: ${{ inputs.codecov_fail_ci_if_error }}
