name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run version consistency check
        run: |
          python scripts/check_versions.py

      - name: Run delivery semantic gate
        run: |
          python scripts/delivery_gate.py

      - name: Print test tool versions
        run: |
          pytest --version
          python -c "import pytest_asyncio; print(f'pytest-asyncio {pytest_asyncio.__version__}')"

      - name: Run unit + integration tests (delivery baseline)
        run: |
          pytest tests/unit tests/integration -m "not e2e" --cov=src --cov-report=xml --cov-fail-under=80 --junitxml=pytest-baseline.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload baseline test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-baseline-report
          path: pytest-baseline.xml

      - name: Upload coverage to Codecov (internal)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  desktop-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Audit desktop dependencies (high+)
        run: npm audit --audit-level=high
        working-directory: desktop

      - name: Run desktop unit tests
        run: npm run test:ci
        working-directory: desktop

      - name: Upload desktop test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-vitest-report
          path: desktop/test-results/vitest.junit.xml

      - name: Check desktop frontend constraints (typecheck + build)
        run: npm run check
        working-directory: desktop

  i18n-check:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run desktop i18n consistency check (warn mode)
        run: |
          python scripts/check_i18n_keys.py

  p2-baseline-soft-warn:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run workflow decision contract baseline (soft warn)
        run: |
          pytest tests/unit/workflow/test_workflow_engine.py -k "decision" -q --no-cov

  p2-high-risk-soft-fail:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [tests, desktop-build]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Run gateway stream contract (high-risk soft fail)
        run: |
          pytest tests/unit/mcp/test_gateway_stream.py -k "contract" -q --no-cov

      - name: Run desktop parser + evaluation apply/undo contracts (high-risk soft fail)
        run: |
          npm --prefix desktop run test -- src/api/client.test.ts src/components/EvaluationPanel.test.tsx

  p2-selected-hard-fail:
    runs-on: ubuntu-latest
    needs: [tests, desktop-build, p2-baseline-soft-warn, p2-high-risk-soft-fail]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Run P2 selected hard gate contracts
        run: |
          pytest tests/unit/workflow/test_workflow_engine.py -k "decision" -q --no-cov
          pytest tests/unit/mcp/test_gateway_stream.py -k "contract" -q --no-cov
          npm --prefix desktop run test -- src/api/client.test.ts src/components/EvaluationPanel.test.tsx

