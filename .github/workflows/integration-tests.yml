name: Integration Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Core validation lane: always blocking for the current desktop + src-ts authority surface.
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run version consistency check
        run: |
          python scripts/check_versions.py

      - name: Run delivery semantic gate
        run: |
          python scripts/delivery_gate.py

      - name: Run Python static checks
        run: |
          python -m ruff check --select F,I scripts tests/unit/scripts
          python -m ruff format --check scripts tests/unit/scripts

      - name: Run governance script regression tests
        run: |
          python scripts/run_targeted_pytest.py tests/unit/scripts/test_governance_scripts.py -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src-ts/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: src-ts

      - name: Audit backend dependencies (high+, blocking)
        run: npm run audit:high
        working-directory: src-ts

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Audit desktop dependencies (high+, blocking)
        run: npm run audit:high
        working-directory: desktop

      - name: Run TypeScript Phase 4 coverage baseline
        run: |
          npm run test:coverage:phase4 -- --coverage.reporter=text --coverage.reporter=json --coverage.reporter=html --coverage.reporter=cobertura
        working-directory: src-ts

      - name: Run current workflow integration smoke
        run: |
          npm exec -- vitest run tests/mcp/workflow-endpoints.integration.test.ts tests/mcp/workflow-critic-smoke.integration.test.ts --reporter=default --reporter=junit --outputFile.junit=../vitest-integration.xml
        working-directory: src-ts

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: src-ts/coverage/cobertura-coverage.xml

      - name: Upload integration report artifact
        uses: actions/upload-artifact@v7
        with:
          name: vitest-integration-report
          path: vitest-integration.xml

      - name: Upload coverage to Codecov (internal)
        uses: codecov/codecov-action@v4
        with:
          files: ./src-ts/coverage/cobertura-coverage.xml
          fail_ci_if_error: false

  # Desktop observation lane: keep broad desktop signal visible on every run.
  desktop-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Rust format check
        run: cargo fmt --all -- --check
        working-directory: desktop/src-tauri

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: desktop/src-tauri

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Audit desktop dependencies (high+)
        run: npm audit --audit-level=high
        working-directory: desktop

      - name: Build desktop sidecar contract artifact
        run: npm run build:sidecar
        working-directory: desktop

      - name: Verify desktop sidecar contract artifact (advisory lane)
        continue-on-error: true
        id: sidecar-contract
        run: npm run validate:sidecar-contract
        working-directory: desktop

      - name: Check desktop frontend constraints (typecheck + build)
        run: npm run check
        working-directory: desktop

      - name: Run desktop unit tests
        run: npm run test:ci
        working-directory: desktop

      - name: Upload desktop test report artifact
        uses: actions/upload-artifact@v7
        with:
          name: desktop-vitest-report
          path: desktop/test-results/vitest.junit.xml

  i18n-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run desktop i18n key parity check
        run: |
          python scripts/check_i18n_keys.py

  authority-alignment-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run authority alignment check (advisory)
        run: |
          python scripts/check_authority_alignment.py > authority-alignment.json

      - name: Upload authority alignment artifact
        uses: actions/upload-artifact@v7
        with:
          name: authority-alignment-report
          path: authority-alignment.json

  authority-alignment-hard-fail:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [authority-alignment-advisory]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run authority alignment check (main hard gate)
        run: |
          python scripts/check_authority_alignment.py

  # Promotion lane: once the sidecar artifact is built successfully, main must keep
  # the contract valid as a blocking condition instead of relying only on advisory telemetry.
  desktop-sidecar-hard-fail:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [desktop-build]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Rebuild desktop sidecar artifact (main hard gate)
        run: npm run build:sidecar
        working-directory: desktop

      - name: Validate desktop sidecar contract (main hard gate)
        run: npm run validate:sidecar-contract
        working-directory: desktop

  desktop-packaging-advisory:
    runs-on: windows-latest
    needs: [desktop-build]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Run desktop packaging dry-run (advisory lane)
        id: packaging-advisory
        continue-on-error: true
        shell: pwsh
        working-directory: desktop
        run: |
          $logPath = Join-Path $PWD 'desktop-packaging-advisory.log'
          & npm run validate:package:dry-run 2>&1 | Tee-Object -FilePath $logPath

      - name: Summarize desktop packaging advisory outcome
        if: always()
        shell: pwsh
        working-directory: desktop
        run: |
          if ('${{ steps.packaging-advisory.outcome }}' -eq 'success') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "desktop-packaging-advisory: packaging dry-run passed."
            return
          }

          $warning = 'desktop-packaging-advisory observed a non-blocking Windows packaging failure. Review the advisory log artifact before release sign-off.'
          Write-Host "::warning::$warning"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "desktop-packaging-advisory: packaging dry-run failed in advisory mode and was downgraded to a warning. Review the uploaded advisory log artifact before release sign-off."

      - name: Upload desktop packaging dry-run artifact (advisory lane)
        if: ${{ hashFiles('desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/niko-studio-desktop.exe') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-packaging-dry-run
          path: desktop/src-tauri/target/x86_64-pc-windows-msvc/debug/niko-studio-desktop.exe

      - name: Upload desktop packaging advisory log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-packaging-advisory-log
          path: desktop/desktop-packaging-advisory.log

  desktop-packaging-hard-fail:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    needs: [desktop-packaging-advisory]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Resolve strict packaging prerequisite
        id: packaging-prereq
        shell: pwsh
        run: |
          $legacyEntry = Test-Path 'src/mcp/sidecar_entry.py'
          $packagedCompatArtifact = Test-Path 'desktop/src-tauri/bin/niko-gateway-x86_64-pc-windows-msvc.exe'

          if ($legacyEntry -or $packagedCompatArtifact) {
            "strict_required=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'desktop-packaging-hard-fail: strict Windows packaging gate enabled (Python compatibility sidecar prerequisite present).'
            return
          }

          "strict_required=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $warning = 'Skipping strict Windows packaging hard gate because this checkout does not include the Python compatibility sidecar prerequisite. Advisory packaging logs remain authoritative until the compatibility artifact is hydrated.'
          Write-Host "::warning::$warning"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'desktop-packaging-hard-fail: skipped strict Windows packaging gate because the Python compatibility sidecar prerequisite is not hydrated in this checkout; review the advisory packaging log instead.'

      - name: Install Rust toolchain
        if: ${{ steps.packaging-prereq.outputs.strict_required == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        if: ${{ steps.packaging-prereq.outputs.strict_required == 'true' }}
        run: npm ci
        working-directory: desktop

      - name: Run desktop packaging dry-run (main hard gate)
        if: ${{ steps.packaging-prereq.outputs.strict_required == 'true' }}
        run: npm run validate:package:dry-run
        working-directory: desktop

  # Advisory governance lanes: keep drift visible while the equivalent blocking lanes exist elsewhere.
  tasks-completion-soft-warn:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [tests]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run tasks completion check (soft warn)
        run: |
          python scripts/check_tasks_completion.py

  tasks-completion-hard-fail:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [tests, tasks-completion-soft-warn]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run tasks completion check (strict)
        run: |
          python scripts/check_tasks_completion.py --strict

  p2-baseline-soft-warn:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [tests]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-ts/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: src-ts

      - name: Run workflow integration baseline (soft warn)
        run: |
          npm exec -- vitest run tests/mcp/workflow-endpoints.integration.test.ts --reporter=default
        working-directory: src-ts

  p2-high-risk-soft-fail:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [tests, desktop-build]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src-ts/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: src-ts

      - name: Audit backend dependencies (high+, advisory)
        continue-on-error: true
        run: npm run audit:high
        working-directory: src-ts

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build desktop sidecar contract artifact (high-risk soft fail)
        run: npm run build:sidecar
        working-directory: desktop

      - name: Verify desktop sidecar contract artifact (high-risk soft fail)
        run: npm run validate:sidecar-contract
        working-directory: desktop

      - name: Run runtime guard contracts (high-risk soft fail)
        run: |
          npm exec -- vitest run tests/gateway-server.runtime.test.ts tests/mcp/health-endpoints.test.ts --reporter=default
        working-directory: src-ts

      - name: Run desktop parser + evaluation apply/undo contracts (high-risk soft fail)
        run: |
          npm --prefix desktop run test -- src/api/client.test.ts src/components/EvaluationPanel.test.tsx src/components/KnowledgeModal.test.tsx

  # Selected enforcement lane: high-risk runtime and desktop contracts remain blocking.
  p2-selected-hard-fail:
    runs-on: ubuntu-latest
    needs: [tests, desktop-build, i18n-check, p2-baseline-soft-warn, p2-high-risk-soft-fail]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src-ts/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: src-ts

      - name: Audit backend dependencies (high+, advisory)
        continue-on-error: true
        run: npm run audit:high
        working-directory: src-ts

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build desktop sidecar contract artifact (selected hard gate)
        run: npm run build:sidecar
        working-directory: desktop

      - name: Validate desktop sidecar contract artifact (selected hard gate)
        run: npm run validate:sidecar-contract
        working-directory: desktop

      - name: Run current src-ts hard gate contracts
        run: |
          npm exec -- vitest run tests/gateway-server.runtime.test.ts tests/mcp/health-endpoints.test.ts tests/mcp/workflow-endpoints.integration.test.ts tests/mcp/workflow-critic-smoke.integration.test.ts --reporter=default
        working-directory: src-ts

      - name: Run desktop selected hard gate contracts
        run: |
          npm --prefix desktop run test -- src/api/client.test.ts src/components/EvaluationPanel.test.tsx src/components/KnowledgeModal.test.tsx

  # Rust supply-chain audit lane: covers desktop/src-tauri Cargo.lock (~600 transitive deps)
  # complementing existing npm audit / pip audit.
  # Advisory-first: continue-on-error keeps day-one RustSec advisories from blocking CI
  # while the team triages. TODO: flip continue-on-error to false after RustSec triage complete.
  cargo-audit-advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [tests]

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-binary-v1

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-audit

      - name: Run cargo audit (advisory)
        id: cargo-audit
        continue-on-error: true
        working-directory: desktop/src-tauri
        run: |
          cargo audit --json | tee cargo-audit-report.json

      - name: Upload cargo-audit report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-report
          path: desktop/src-tauri/cargo-audit-report.json

      - name: Summarize cargo audit outcome
        if: always()
        run: |
          if [ "${{ steps.cargo-audit.outcome }}" = "success" ]; then
            echo "cargo-audit-advisory: no RustSec advisories found." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::cargo-audit-advisory observed RustSec advisories. Review the cargo-audit-report artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "cargo-audit-advisory: advisories present (advisory mode — non-blocking)." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ISS-20260430-002 — Layer 4 packaged-app smoke automation.
  # Builds the NSIS installer, silent-installs to a temp dir on a Windows runner,
  # launches the packaged app, asserts /health version matches package.json,
  # 7 services healthy, and CORS allows tauri://localhost origin.
  # Catches the ISS-20260430-001 class (stale sidecar / CORS / version drift).
  # Promoted to blocking in v9.2.2 after the ISS-20260430-001 closure landed
  # (sidecar guards + ABI alignment + launcher path resolution + smoke port pin).
  # The job tolerates NSIS-build infra failure (Rust toolchain / runner quirks),
  # but if the installer IS produced the smoke result is enforcing.
  packaged-app-smoke:
    runs-on: windows-latest
    needs: [desktop-packaging-advisory]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build sidecar contract artifact
        run: npm run build:sidecar
        working-directory: desktop

      - name: Build NSIS installer (release, unsigned)
        id: nsis-build
        continue-on-error: true
        shell: pwsh
        working-directory: desktop
        run: |
          npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Locate NSIS installer
        if: steps.nsis-build.outcome == 'success'
        id: locate-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $installer) {
            Write-Host '::warning::NSIS installer not produced — packaged-app-smoke will skip'
            "installer_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            return
          }
          Write-Host "Found installer: $($installer.FullName)"
          "installer_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run packaged-app smoke test
        if: steps.nsis-build.outcome == 'success' && steps.locate-installer.outputs.installer_found == 'true'
        id: smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .workflow/evidence/release -Force | Out-Null
          python scripts/packaged_app_smoke.py `
            --installer-path '${{ steps.locate-installer.outputs.installer_path }}' `
            --report .workflow/evidence/release/packaged-app-smoke.json

      - name: Summarize packaged-app-smoke outcome
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.smoke.outcome }}' -eq 'success') {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'packaged-app-smoke: PASS — sidecar contract honored after install+launch.'
          } elseif ('${{ steps.nsis-build.outcome }}' -ne 'success') {
            Write-Host '::warning::packaged-app-smoke skipped — NSIS build failed earlier in pipeline (infra-level, not gating).'
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'packaged-app-smoke: SKIPPED (NSIS build failed — infra issue, non-gating).'
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value 'packaged-app-smoke: FAIL — sidecar contract violation. Review .workflow/evidence/release/packaged-app-smoke.json.'
          }

      - name: Upload packaged-app-smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-app-smoke-report
          path: .workflow/evidence/release/packaged-app-smoke.json
          if-no-files-found: ignore

  # Performance benchmark lane: advisory, non-blocking quality signal.
  performance-benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: [tests]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src-ts/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: src-ts

      - name: Run consistency gate benchmarks
        run: |
          npm exec -- vitest run tests/benchmark/ --reporter=default
        working-directory: src-ts

      - name: Upload benchmark report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: src-ts/tests/benchmark/

