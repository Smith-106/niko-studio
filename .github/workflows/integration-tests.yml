name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run version consistency check
        run: |
          python scripts/check_versions.py

      - name: Run delivery semantic gate
        run: |
          python scripts/delivery_gate.py

      - name: Print test tool versions
        run: |
          pytest --version
          python -c "import pytest_asyncio; print(f'pytest-asyncio {pytest_asyncio.__version__}')"

      - name: Run unit + integration tests (delivery baseline)
        run: |
          pytest tests/unit tests/integration -m "not e2e" --cov=src --cov-report=xml --cov-fail-under=80 --junitxml=pytest-baseline.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload baseline test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-baseline-report
          path: pytest-baseline.xml

      - name: Upload coverage to Codecov (internal)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  desktop-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Build desktop frontend (TypeScript + Vite)
        run: npm run build
        working-directory: desktop

  external-precheck-e2e:
    if: github.event_name == 'pull_request'
    needs: [tests, desktop-build]
    uses: ./.github/workflows/external-release-gate.yml
    with:
      run_codecov: false
      run_metrics_guard: false
      gate_label: pr-precheck

  external-e2e-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, desktop-build]
    uses: ./.github/workflows/external-release-gate.yml
    with:
      run_codecov: false
      run_metrics_guard: true
      gate_label: external

  external-quality-signals:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, desktop-build]
    uses: ./.github/workflows/external-release-gate.yml
    with:
      run_codecov: true
      codecov_fail_ci_if_error: true
      run_metrics_guard: true
      run_e2e: false
      gate_label: external-quality
